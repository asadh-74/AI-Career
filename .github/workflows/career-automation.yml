name: Career Atlas Review-First Job Preparation

on:
  workflow_dispatch:
  schedule:
    # Refresh relevant opportunities four times a day.
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: career-atlas-review-first
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      AUTO_APPLY: "false"
      PREPARE_ONLY: "true"
      AUTO_SUBMIT_BROWSER: "false"
      MIN_MATCH_SCORE: "72"
      MAX_APPLICATIONS_PER_DAY: "15"
      REMOTE_ONLY: "true"
      SOFTWARE_ONLY: "true"
      ALLOW_EMAIL_APPLICATIONS: "false"
      ALLOW_BROWSER_APPLICATIONS: "false"
      CONTRACT_PROJECT_ONLY: "true"
      TAILOR_RESUME: "true"
      ENABLE_EMAIL_MONITOR: "false"
      APPLICANT_PROFILE_JSON: ${{ secrets.APPLICANT_PROFILE_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Find matching roles and prepare review drafts
        run: python worker.py
